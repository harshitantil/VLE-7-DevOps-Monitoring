apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle7-demo
  namespace: default
  labels:
    app: vle7-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle7-demo
  template:
    metadata:
      labels:
        app: vle7-demo
    spec:
      containers:
        - name: vle7-demo
          image: vle7-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
